name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  gauntlet:
    name: UltraGauntlet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      # Playwright is only needed for the browser stage, so it is not a
      # dependency of the game itself.
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      # Thirteen stages, one gate: see docs/ultragauntlet.md.
      - run: npm run gauntlet
