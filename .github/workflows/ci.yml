name: CI

on:
  # Every branch, not just main. With one author the first CI signal for a
  # commit could safely be the PR; with several agents pushing to vendor/topic
  # branches, a broken push otherwise sits unnoticed until someone opens one.
  # Raised by Devin in the external review. The gauntlet cost is already paid
  # per PR; this moves the signal earlier, it does not add a new one.
  push:
    branches: ['**']
  pull_request:

# Pushing to a branch that has an open PR fires BOTH events. They used to share
# one group, so the older run was cancelled and the gauntlet ran once per push.
# That broke on 9 October, when the "main: require CI" ruleset made these jobs
# required checks. GitHub judges required checks per run, not per commit: any
# cancelled run carrying a required name blocks the PR, even when another run
# of the same commit passed. #53 sat blocked that way until the cancelled job
# was re-run, and 777945e and 966ff27 carry the same stale cancellations from
# branch pushes. Shuffling which runs cancel which cannot fix it; a reopened
# PR, a re-run of an old run or a force-push back to an earlier commit can
# still land a cancellation on the head. So the two events now do different
# jobs:
# - pull_request runs are the gate. Each one gets its own group (the run id),
#   so nothing ever cancels it. A run superseded by a newer push finishes
#   anyway: runner time only, since Actions minutes are free on this public
#   repo.
# - push runs keep the every-branch early signal above. They cancel their own
#   older runs per branch, and they report under suffixed names (see the jobs)
#   that the ruleset does not require, so a cancelled push run cannot block a
#   merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_id || github.ref }}
  cancel-in-progress: true

# On pull_request runs, the job names below are exactly the required checks in
# the "main: require CI" ruleset: "Unit tests (Node 20.x)", "Unit tests (Node
# 22.x)", "UltraGauntlet". Every other event appends its name, for example
# "UltraGauntlet [push]", so those runs never count toward the gate. Renaming
# a job or changing the Node matrix stops a required check reporting, and every
# PR then waits on it forever. Update the ruleset in the same change.
jobs:
  unit:
    name: "Unit tests (Node ${{ matrix.node }})${{ github.event_name != 'pull_request' && format(' [{0}]', github.event_name) || '' }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  gauntlet:
    name: "UltraGauntlet${{ github.event_name != 'pull_request' && format(' [{0}]', github.event_name) || '' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      # Playwright is only needed for the browser stage, so it is not a
      # dependency of the game itself.
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      # Thirteen stages, one gate: see docs/ultragauntlet.md.
      - run: npm run gauntlet
