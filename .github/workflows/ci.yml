name: CI

on:
  # Every branch, not just main. With one author the first CI signal for a
  # commit could safely be the PR; with several agents pushing to vendor/topic
  # branches, a broken push otherwise sits unnoticed until someone opens one.
  # Raised by Devin in the external review. The gauntlet cost is already paid
  # per PR; this moves the signal earlier, it does not add a new one.
  push:
    branches: ['**']
  pull_request:

# Pushing to a branch that has an open PR fires BOTH events, which ran the
# ~5-minute gauntlet twice for one push the moment feature-branch coverage was
# turned on above. head_ref (set on pull_request) and ref_name (set on push)
# are the same branch name, so both events land in one group and the older run
# is cancelled. Feature-branch coverage without paying for it twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  gauntlet:
    name: UltraGauntlet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      # Playwright is only needed for the browser stage, so it is not a
      # dependency of the game itself.
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      # Thirteen stages, one gate: see docs/ultragauntlet.md.
      - run: npm run gauntlet
